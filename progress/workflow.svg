<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" role="img"
     aria-labelledby="svgTitle svgDesc"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="svgTitle">How the work is planned and handed off</title>
  <desc id="svgDesc">Two swimlanes, one per person, showing real tasks from August and September 2026
  ordered by dependency, with handoffs between the two owners; and below, the four-step loop each
  task passes through. The task system and this diagram were designed by Victoria.</desc>

  <defs>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#120417"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b60c28"/>
    </marker>
  </defs>

  <rect width="1200" height="690" fill="#fbf9f8"/>
  <rect x="0.5" y="0.5" width="1199" height="689" fill="none" stroke="#e6e1e7"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="#120417">How the work is planned and handed off</text>
  <text x="40" y="64" font-size="13" fill="#5d5760">Two owners, one board ordered by dependency, one loop per task. Boxes are real tasks; horizontal position is order of work, not time to scale.</text>

  <!-- ============ PANEL 1 : THE BOARD ============ -->
  <text x="40" y="104" font-size="13" font-weight="700" fill="#120417" letter-spacing="0.08em">1 — THE BOARD</text>

  <rect x="40" y="116" width="1120" height="96" rx="4" fill="#f4f1f4" stroke="#e6e1e7"/>
  <rect x="40" y="228" width="1120" height="96" rx="4" fill="#f4f1f4" stroke="#e6e1e7"/>
  <text x="54" y="138" font-size="11.5" font-weight="700" letter-spacing="0.1em" fill="#b60c28">VICTORIA</text>
  <text x="54" y="250" font-size="11.5" font-weight="700" letter-spacing="0.1em" fill="#120417">LETA</text>

  <!-- Victoria's tasks -->
  <g fill="#ffffff" stroke="#d8d2d9" stroke-width="1">
    <rect x="170" y="132" width="130" height="56" rx="6"/>
    <rect x="322" y="132" width="130" height="56" rx="6"/>
    <rect x="474" y="132" width="130" height="56" rx="6"/>
    <rect x="778" y="132" width="130" height="56" rx="6"/>
    <rect x="930" y="132" width="130" height="56" rx="6"/>
  </g>
  <g fill="#b60c28" stroke="none">
    <rect x="170" y="132" width="4" height="56"/>
    <rect x="322" y="132" width="4" height="56"/>
    <rect x="474" y="132" width="4" height="56"/>
    <rect x="778" y="132" width="4" height="56"/>
    <rect x="930" y="132" width="4" height="56"/>
  </g>
  <g font-size="12" font-weight="600" fill="#120417">
    <text x="184" y="152">Repo + project</text><text x="184" y="166">setup</text>
    <text x="336" y="152">Vertical slice</text>
    <text x="488" y="152">World + case</text><text x="488" y="166">written</text>
    <text x="792" y="152">Clue gate +</text><text x="792" y="166">end card</text>
    <text x="944" y="152">Web + Windows</text><text x="944" y="166">builds</text>
  </g>
  <g font-size="10.5" fill="#6d666f">
    <text x="184" y="180">L · 10 Aug</text>
    <text x="336" y="180">L · 12 Aug</text>
    <text x="488" y="180">L · 18 Aug</text>
    <text x="792" y="180">M · 29 Aug</text>
    <text x="944" y="180">L · 15 Sep</text>
  </g>

  <!-- Leta's tasks -->
  <g fill="#ffffff" stroke="#d8d2d9" stroke-width="1">
    <rect x="474" y="244" width="130" height="56" rx="6"/>
    <rect x="626" y="244" width="130" height="56" rx="6"/>
    <rect x="778" y="244" width="130" height="56" rx="6"/>
    <rect x="930" y="244" width="130" height="56" rx="6"/>
  </g>
  <g fill="#120417" stroke="none">
    <rect x="474" y="244" width="4" height="56"/>
    <rect x="626" y="244" width="4" height="56"/>
    <rect x="778" y="244" width="4" height="56"/>
    <rect x="930" y="244" width="4" height="56"/>
  </g>
  <g font-size="12" font-weight="600" fill="#120417">
    <text x="488" y="264">2D style guide</text>
    <text x="640" y="264">Clue data</text><text x="640" y="278">model</text>
    <text x="792" y="264">Environment</text><text x="792" y="278">blockout</text>
    <text x="944" y="264">Lighting +</text><text x="944" y="278">grade</text>
  </g>
  <g font-size="10.5" fill="#6d666f">
    <text x="488" y="292">M · 18 Aug</text>
    <text x="640" y="292">M · 19 Aug</text>
    <text x="792" y="292">L · 28 Aug</text>
    <text x="944" y="292">M · 29 Aug</text>
  </g>

  <!-- same-owner ordering -->
  <g stroke="#120417" stroke-width="1.6" fill="none" marker-end="url(#arrowInk)">
    <path d="M300,160 L316,160"/>
    <path d="M452,160 L468,160"/>
    <path d="M604,160 L772,160"/>
    <path d="M908,160 L924,160"/>
    <path d="M604,272 L620,272"/>
    <path d="M756,272 L772,272"/>
    <path d="M908,272 L924,272"/>
  </g>

  <!-- handoffs between owners, routed through the gutter -->
  <g stroke="#b60c28" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)">
    <path d="M452,172 L460,172 Q468,172 468,180 L468,208 Q468,216 476,216 L608,216 Q616,216 616,224 L616,264 Q616,272 624,272"/>
    <path d="M690,244 L690,228 Q690,216 702,216 L760,216 Q770,216 770,206 L770,170 Q770,160 778,160"/>
    <path d="M995,244 L995,194"/>
  </g>

  <!-- legend -->
  <path d="M44,352 L74,352" stroke="#120417" stroke-width="1.6" fill="none" marker-end="url(#arrowInk)"/>
  <path d="M284,352 L314,352" stroke="#b60c28" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <g font-size="11.5" fill="#5d5760">
    <text x="82" y="356">same person, next in order</text>
    <text x="322" y="356">handoff: one person's output unblocks the other</text>
    <text x="700" y="356">S / M / L = size, estimated before the date was set</text>
  </g>

  <!-- ============ PANEL 2 : INSIDE ONE TASK ============ -->
  <text x="40" y="420" font-size="13" font-weight="700" fill="#120417" letter-spacing="0.08em">2 — WHAT HAPPENS INSIDE ONE TASK</text>

  <g fill="#ffffff" stroke="#d8d2d9" stroke-width="1">
    <rect x="40" y="440" width="258" height="92" rx="6"/>
    <rect x="328" y="440" width="258" height="92" rx="6"/>
    <rect x="616" y="440" width="258" height="92" rx="6"/>
    <rect x="904" y="440" width="256" height="92" rx="6"/>
  </g>
  <g font-size="13" font-weight="700" fill="#120417">
    <text x="58" y="466">1 · Brief</text>
    <text x="346" y="466">2 · AI agent</text>
    <text x="634" y="466">3 · Owner assembles</text>
    <text x="922" y="466">4 · Owner tests</text>
  </g>
  <g font-size="11.5" fill="#4a444d">
    <text x="58" y="488">Written from the design docs:</text>
    <text x="58" y="504">what it must do, and why.</text>
    <text x="58" y="520">Owned by one of us, never both.</text>
    <text x="346" y="488">Writes the C# and the exact</text>
    <text x="346" y="504">editor steps. It cannot open</text>
    <text x="346" y="520">the engine or run the game.</text>
    <text x="634" y="488">Follows the steps in the engine:</text>
    <text x="634" y="504">wires scripts to objects, builds</text>
    <text x="634" y="520">placeholders, sets the scene up.</text>
    <text x="922" y="488">Plays it and reports what is</text>
    <text x="922" y="504">wrong. Nothing is done until</text>
    <text x="922" y="520">the owner has played it.</text>
  </g>

  <g stroke="#120417" stroke-width="1.6" fill="none" marker-end="url(#arrowInk)">
    <path d="M298,486 L322,486"/>
    <path d="M586,486 L610,486"/>
    <path d="M874,486 L898,486"/>
  </g>
  <path d="M1032,532 L1032,560 Q1032,570 1022,570 L467,570 Q457,570 457,560 L457,538"
        stroke="#b60c28" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="690" y="588" font-size="11.5" fill="#5d5760">repeats until it works</text>

  <text x="40" y="616" font-size="11.5" fill="#5d5760">Whatever gets decided along the way goes back into the design docs, with the date — a decision that only exists in a chat is lost.</text>

  <g font-size="11" fill="#6d666f">
    <text x="40" y="658">The task system and this diagram: Victoria. The tasks shown are real, from Aug–Sep 2026.</text>
    <text x="40" y="674">All C# referenced in step 2 is AI-written, from our specifications. Neither of us is a programmer.</text>
  </g>
</svg>
